name: Zhixi native build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    # 标准公开 runner 免费；私有仓库须先确认账户免费余额及费用限制。
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: body-status
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show actual toolchain
        run: |
          mkdir -p artifacts
          xcodebuild -version
          swift --version
          node --version
          python3 --version

      - name: Check project and web tests
        run: |
          python3 tools/check_project.py
          node --test --test-reporter=spec web/tests/*.test.mjs

      - name: Run Swift core tests
        run: swift test 2>&1 | tee artifacts/swift-tests.log

      - name: Build iPhone simulator app
        run: |
          xcodebuild -project BodyStatus.xcodeproj -scheme BodyStatus \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios-simulator CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/ios-simulator.log

      - name: Build Watch simulator app
        run: |
          xcodebuild -project BodyStatus.xcodeproj -scheme BodyStatusWatch \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath .build/watch-simulator CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/watch-simulator.log

      - name: Build unsigned iPhone device app
        run: |
          xcodebuild -project BodyStatus.xcodeproj -scheme BodyStatus \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios-device CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/ios-device.log
          ditto -c -k --keepParent .build/ios-device/Build/Products/Release-iphoneos/BodyStatus.app artifacts/BodyStatus-unsigned-device.zip
          printf '%s\n' 'This app is unsigned. It cannot be installed on an iPhone until Apple signing and provisioning are completed.' > artifacts/READ-ME.txt

      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zhixi-build-${{ github.run_id }}
          path: body-status/artifacts/
          retention-days: 1
          if-no-files-found: warn
